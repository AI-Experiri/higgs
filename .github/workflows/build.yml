# Smoke-build the release's Linux CUDA leg on the SELF-HOSTED runner (Coolify,
# ephemeral) — Approach B: the job runs INSIDE a prebuilt CUDA container, so
# nothing CUDA-related is installed per run (the per-job toolkit install was a
# 30+ minute apt avalanche on a bare ephemeral runner).
#
# Container choice is deliberate:
#   - CUDA 12.5.0  = the exact version release.yml pins (Jimver action, cuda: 12.5.0)
#   - ubuntu22.04  = the release's glibc baseline (CI builds on ubuntu-22.04;
#     a 24.04 build would link a newer glibc and not run on 22.04-era boxes)
# The devel image ships nvcc + gcc; the small apt below adds only the cmake/clang
# FFI+bindgen deps (--no-install-recommends — no desktop bloat).
#
# Rust is installed per job (ephemeral runner, ~30s via rustup).
# Build command = release.yml's cuda leg, verbatim.
name: build
on:
  workflow_dispatch:
  push:
    branches: ["smoke/**"]   # scoped: a long CUDA build must not fire on every push

jobs:
  build-cuda:
    runs-on: [self-hosted, cuda]
    container: nvidia/cuda:12.5.0-devel-ubuntu22.04
    timeout-minutes: 180
    steps:
      - name: Show where and what (pre-checkout)
        run: |
          echo "hostname: $(hostname)"
          uname -a
          echo "runner name: ${RUNNER_NAME:-unknown}"
          nvcc --version

      - name: Install build deps (small, no recommends)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config libssl-dev git curl ca-certificates
      - name: Bootstrap Rust
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify toolchain + commit
        run: |
          git config --global --add safe.directory "$PWD" || true
          git log -1 --oneline && git rev-parse HEAD
          rustc --version && cargo --version
          cmake --version | head -1
          gcc --version | head -1

      # Mirror release.yml's Linux env: neutralize the macOS-only [env] from
      # .cargo/config.toml, disable OpenMP, bound the CUDA arch list.
      - name: Configure build env
        run: |
          set -euo pipefail
          {
            echo "CMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON"
            echo "SDKROOT="
            echo "BINDGEN_EXTRA_CLANG_ARGS="
            echo "CUDAARCHS=75;80;86;89;90"
          } >> "$GITHUB_ENV"

      - name: Build (release.yml cuda leg command)
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --features cuda

      - name: Prove the artifact
        run: |
          ls -la target/x86_64-unknown-linux-gnu/release/higgs
          ./target/x86_64-unknown-linux-gnu/release/higgs --version
