# Smoke-build the release's Linux CUDA leg on the self-hosted runner, AS-IS:
# bare ephemeral container, no `container:`, no host mounts. CUDA = only the 4
# packages nvcc needs (no metapackage, --no-install-recommends → no GUI).
# Build command = release.yml's cuda leg, verbatim.
name: build
on:
  workflow_dispatch:
  push:
    branches: ["smoke/**"]

jobs:
  build-cuda:
    runs-on: [self-hosted, cuda]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Show where and what
        run: |
          echo "hostname: $(hostname)"
          uname -a
          git log -1 --oneline && git rev-parse HEAD
          echo "runner name: ${RUNNER_NAME:-unknown}"

      - name: Base build deps (no recommends, no GUI)
        run: |
          set -euo pipefail
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang libclang-dev \
            git curl wget ca-certificates gnupg

      - name: Bootstrap Rust
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: CUDA 12.5 — nvcc + cudart + cublas ONLY
        run: |
          set -euo pipefail
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && rm cuda-keyring_1.1-1_all.deb
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends \
            cuda-nvcc-12-5 cuda-cudart-dev-12-5 libcublas-dev-12-5 cuda-profiler-api-12-5
          echo "/usr/local/cuda-12.5/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          nvcc --version
          rustc --version && cargo --version
          gcc --version | head -1

      - name: Configure build env (mirror release.yml Linux)
        run: |
          set -euo pipefail
          {
            echo "CMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON"
            echo "SDKROOT="
            echo "BINDGEN_EXTRA_CLANG_ARGS="
            echo "CUDAARCHS=75;80;86;89;90"
            echo "CUDA_PATH=/usr/local/cuda-12.5"
          } >> "$GITHUB_ENV"

      - name: Build (release.yml cuda leg command)
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --features cuda

      - name: Prove the artifact
        run: |
          ls -la target/x86_64-unknown-linux-gnu/release/higgs
          ./target/x86_64-unknown-linux-gnu/release/higgs --version
