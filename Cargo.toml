[package]
name = "higgs"
version = "0.1.0"
edition = "2021"
description = "In-app local model runtime: OpenAI-compatible serving over llama.cpp with crash-isolated worker"
license = "MIT"

[dependencies]
# full: supervisor needs rt+sync+time+io, worker needs rt+process+io — Tasks 2-12 use all of it
tokio = { version = "1", features = ["full"] }
# Default OS-specific directories (home, config, cache, data). 246M downloads.
dirs = "5"
axum = { version = "0.8" }
# OpenAI wire types ONLY (no HTTP client): /v1 request/response/chunk shapes
# come from this crate verbatim — never hand-rolled.
async-openai = { version = "0.41", default-features = false, features = ["chat-completion-types", "model-types"] }
# chatcmpl-{uuid} response ids (mirrors shimmy/omlx id construction)
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
miette = "7"
tracing = "0.1"
parking_lot = "0.12"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }
llama-cpp-2 = "0.1"
# token_to_piece (the crate's non-deprecated detokenizer) takes &mut encoding_rs::Decoder
encoding_rs = "0.8"
# Header-only GGUF metadata reading (memory-maps the file; weights are never loaded)
ggus = "0.5.1"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
