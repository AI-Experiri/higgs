[package]
name = "higgs"
version = "0.1.0"
edition = "2021"
description = "In-app local model runtime: OpenAI-compatible serving over llama.cpp with crash-isolated worker"
license = "MIT"

[dependencies]
# full: supervisor needs rt+sync+time+io, worker needs rt+process+io — Tasks 2-12 use all of it
tokio = { version = "1", features = ["full"] }
# Default OS-specific directories (home, config, cache, data). 246M downloads.
dirs = "5"
axum = { version = "0.8" }
# OpenAI wire types ONLY (no HTTP client): /v1 request/response/chunk shapes
# come from this crate verbatim — never hand-rolled.
async-openai = { version = "0.41", default-features = false, features = ["chat-completion-types", "model-types"] }
# chatcmpl-{uuid} response ids (mirrors shimmy/omlx id construction)
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
rand = "0.8"
miette = "7"
tracing = "0.1"
parking_lot = "0.12"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }
llama-cpp-2 = "0.1"
# Raw FFI for the engine version string — the safe `llama-cpp-2` crate wraps
# neither `ggml_version()` nor `llama_print_system_info()`. Pinned to match the
# `llama-cpp-2` resolution so both link the same vendored llama.cpp.
llama-cpp-sys-2 = "0.1"
# token_to_piece (the crate's non-deprecated detokenizer) takes &mut encoding_rs::Decoder
encoding_rs = "0.8"
# Header-only GGUF metadata reading (memory-maps the file; weights are never loaded)
ggus = "0.5.1"
memmap2 = "0.9"
# Host hardware + resource info (CPU name/arch, RAM total/used, CPU load) for
# the /api/higgs/system endpoint. Cross-platform, ~200M downloads.
sysinfo = "0.32"
# CORS for higgs's standalone listener (the frontend calls it cross-origin from
# the webview / dev server once higgs is its own process).
# cors: cross-origin from the webview/dev server. catch-panic: a handler panic
# returns a structured 500 instead of dropping the connection (ollama gin
# Recovery). limit: caps request-body size (MAX_BODY_BYTES). timeout: bounds
# non-streaming control routes only — never the SSE chat stream.
tower-http = { version = "0.6", features = ["cors", "catch-panic", "limit", "timeout"] }
# Structured logs for the `higgs-server` binary.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# HTTP client for the black-box integration tests (spawn higgs-server, drive /v1
# + /api/higgs over real HTTP). rustls to avoid a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# SIGTERM the spawned server for graceful shutdown (so its coverage profile
# flushes — a hard SIGKILL would drop it).
libc = "0.2"

[lints]
workspace = true
